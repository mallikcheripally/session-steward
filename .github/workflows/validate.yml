name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production files
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Install Windows command shims
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --global .
          session-steward.cmd --version
          session-steward-cli.cmd --help

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Benchmark session listing
        run: npm run benchmark:scale

      - name: Benchmark overview and filters
        run: npm run benchmark:overview

      - name: Benchmark metadata discovery
        run: npm run benchmark:discovery

      - name: Benchmark Claude discovery
        run: npm run benchmark:claude-discovery

      - name: Benchmark transcript discovery
        run: npm run benchmark:transcripts

      - name: Benchmark session sizes
        run: npm run benchmark:size

      - name: Benchmark versioned stores
        run: npm run benchmark:versioned-stores

      - name: Benchmark session events
        run: npm run benchmark:events
